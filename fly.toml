# Fly.io app. Deploys from .github/workflows/deploy.yml on every push to main;
# by hand: fly deploy
app = "adondeva"
primary_region = "gru" # São Paulo, the closest region to Uruguay

[build]

[env]
  USO_DB = "/data/uso.db" # usage log, on the volume below so it survives deploys
  CANONICAL_HOST = "adondeva.org" # www.adondeva.org redirects here

[mounts]
  source = "uso"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a cold start would add the server's startup to the first visit.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
